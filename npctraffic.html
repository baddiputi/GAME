<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC Traffic Mode - Street Racing Game</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
      }
    }
  </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial Black', sans-serif;
        }

        /* HUD Container */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        /* Mode Label */
        #mode-label {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.25), rgba(0, 100, 200, 0.25));
            border: 1px solid rgba(0, 200, 255, 0.6);
            color: #00e5ff;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 3px;
            padding: 6px 20px;
            border-radius: 20px;
            text-shadow: 0 0 10px #00e5ff;
            backdrop-filter: blur(8px);
        }

        /* Left Panel */
        #left-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 14px;
            backdrop-filter: blur(10px);
            min-width: 160px;
        }

        .hud-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }

        /* Health Bar */
        #health-bar-wrap {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        #health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00e676, #69f0ae);
            border-radius: 4px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        /* Speed Bar */
        #speed-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }

        #speed-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b0ff, #00e5ff);
            border-radius: 3px;
            transition: width 0.1s ease;
        }

        /* Right Panel */
        #right-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        /* Difficulty Selector */
        #difficulty-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: all;
        }

        .diff-btn {
            font-family: 'Arial Black', sans-serif;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .diff-btn:hover {
            border-color: rgba(255, 255, 255, 0.7);
            color: #fff;
        }

        .diff-btn.active-easy {
            border-color: #00e676;
            color: #00e676;
            background: rgba(0, 230, 118, 0.15);
        }

        .diff-btn.active-medium {
            border-color: #ffab00;
            color: #ffab00;
            background: rgba(255, 171, 0, 0.15);
        }

        .diff-btn.active-hard {
            border-color: #ff1744;
            color: #ff1744;
            background: rgba(255, 23, 68, 0.15);
        }

        /* Back Button */
        #back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: 'Arial Black', sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            pointer-events: all;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        #back-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Crash Flash */
        #crash-flash {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 30, 30, 0.45);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        /* Overtake Notification */
        #overtake-notif {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: #00e676;
            text-shadow: 0 0 20px #00e676;
            letter-spacing: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 60px;
            right: 16px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
            text-align: right;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div id="hud">
        <div id="mode-label">⚡ NPC TRAFFIC MODE</div>

        <!-- Left Panel -->
        <div id="left-panel">
            <div class="hud-card">
                <div class="hud-label">Score</div>
                <div class="hud-value" id="score-val">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Health</div>
                <div class="hud-value" id="health-val">100</div>
                <div id="health-bar-wrap">
                    <div id="health-bar"></div>
                </div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Speed</div>
                <div class="hud-value" id="speed-val">0 <span
                        style="font-size:12px;color:rgba(255,255,255,0.5)">km/h</span></div>
                <div id="speed-bar-wrap">
                    <div id="speed-bar"></div>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div id="right-panel">
            <div class="hud-card" style="text-align:right;">
                <div class="hud-label">Traffic Density</div>
                <div class="hud-value" id="density-val">—</div>
            </div>
            <div class="hud-card" style="text-align:right;">
                <div class="hud-label">Active NPCs</div>
                <div class="hud-value" id="npc-count-val">0</div>
            </div>
            <div class="hud-card" style="text-align:right;">
                <div class="hud-label">Overtakes</div>
                <div class="hud-value" id="overtake-val">0</div>
            </div>
        </div>

        <!-- Crash Flash -->
        <div id="crash-flash"></div>

        <!-- Overtake Notification -->
        <div id="overtake-notif">+50 SAFE OVERTAKE!</div>

        <!-- Difficulty Selector -->
        <div id="difficulty-panel">
            <button class="diff-btn active-easy" id="btn-easy" onclick="setDifficulty('easy')">EASY</button>
            <button class="diff-btn" id="btn-medium" onclick="setDifficulty('medium')">MEDIUM</button>
            <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">HARD</button>
        </div>

        <!-- Back Button -->
        <button id="back-btn" onclick="window.location.href='index.html'">← BACK</button>

        <!-- Controls Hint -->
        <div id="controls-hint">
            W / ↑ &nbsp; Accelerate<br>
            S / ↓ &nbsp; Brake<br>
            A / ← &nbsp; Steer Left<br>
            D / → &nbsp; Steer Right<br>
            SPACE &nbsp; Handbrake
        </div>
    </div>

    <script type="module" src="./src/main2.js"></script>
</body>

</html>
