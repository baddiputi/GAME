<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Rules Mode – Street Racing Game</title>
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
    }
  }
  </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial Black', sans-serif;
        }

        /* ── HUD ── */
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        #mode-label {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.55);
        }

        /* Left panel */
        #left-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 14px;
            backdrop-filter: blur(10px);
            min-width: 130px;
        }

        .hud-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .hud-unit {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
        }

        /* Speed bar */
        #speed-bar-wrap {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }

        #speed-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b0ff, #00e5ff);
            border-radius: 3px;
            transition: width .1s ease;
        }

        /* Speed limit badge */
        #limit-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #ff6f00;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #limit-badge .lbl {
            font-size: 8px;
            letter-spacing: 1px;
            color: #ff6f00;
        }

        #limit-badge .val {
            font-size: 22px;
            font-weight: 900;
            color: #ff6f00;
            line-height: 1;
        }

        /* Right panel */
        #right-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        /* Traffic light widget */
        #signal-widget {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 90px;
        }

        .signal-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            opacity: 0.2;
            transition: opacity .3s, box-shadow .3s;
        }

        .signal-dot.active {
            opacity: 1;
        }

        #dot-red {
            background: #ff1744;
        }

        #dot-red.active {
            box-shadow: 0 0 12px #ff1744;
        }

        #dot-yellow {
            background: #ffab00;
        }

        #dot-yellow.active {
            box-shadow: 0 0 12px #ffab00;
        }

        #dot-green {
            background: #00e676;
        }

        #dot-green.active {
            box-shadow: 0 0 12px #00e676;
        }

        #signal-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        /* Violations */
        #viol-card {
            text-align: right;
        }

        #viol-val {
            color: #ff5252;
        }

        /* Score */
        #score-val {
            color: #00e5ff;
        }

        /* Difficulty buttons */
        #diff-panel {
            position: absolute;
            bottom: 60px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .diff-btn {
            font-family: 'Arial Black', sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            pointer-events: all;
            transition: all .2s;
            backdrop-filter: blur(8px);
        }

        .diff-btn:hover {
            border-color: rgba(255, 255, 255, 0.7);
            color: #fff;
        }

        .diff-btn.active-easy {
            border-color: #00e676;
            color: #00e676;
            background: rgba(0, 230, 118, .15);
        }

        .diff-btn.active-medium {
            border-color: #ffab00;
            color: #ffab00;
            background: rgba(255, 171, 0, .15);
        }

        .diff-btn.active-hard {
            border-color: #ff5252;
            color: #ff5252;
            background: rgba(255, 82, 82, .15);
        }

        /* Back button */
        #back-btn {
            position: absolute;
            bottom: 16px;
            left: 16px;
            font-family: 'Arial Black', sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            pointer-events: all;
            transition: all .2s;
            backdrop-filter: blur(8px);
        }

        #back-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, .6);
        }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 60px;
            left: 16px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            line-height: 1.8;
        }

        /* Warning flash */
        #warning-flash {
            position: absolute;
            inset: 0;
            background: rgba(255, 100, 0, 0.35);
            pointer-events: none;
            opacity: 0;
            transition: opacity .15s ease;
        }

        #red-flash {
            position: absolute;
            inset: 0;
            background: rgba(255, 20, 20, 0.45);
            pointer-events: none;
            opacity: 0;
            transition: opacity .15s ease;
        }

        /* Warning message */
        #warning-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ff6f00;
            text-shadow: 0 0 30px #ff6f00;
            opacity: 0;
            transition: opacity .2s;
            text-align: center;
            pointer-events: none;
        }

        /* Minimap placeholder */
        #minimap {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        #minimap canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="hud">
        <div id="mode-label">🚦 TRAFFIC RULES MODE</div>

        <!-- Left Panel -->
        <div id="left-panel">
            <!-- Speed -->
            <div class="hud-card">
                <div class="hud-label">SPEED</div>
                <div class="hud-value" id="speed-val">0 <span class="hud-unit">km/h</span></div>
                <div id="speed-bar-wrap">
                    <div id="speed-bar"></div>
                </div>
            </div>
            <!-- Score -->
            <div class="hud-card">
                <div class="hud-label">SCORE</div>
                <div class="hud-value" id="score-val">100</div>
            </div>
            <!-- Violations -->
            <div class="hud-card" id="viol-card">
                <div class="hud-label">VIOLATIONS</div>
                <div class="hud-value" id="viol-val">0</div>
            </div>
        </div>

        <!-- Right Panel -->
        <div id="right-panel">
            <!-- Traffic Signal -->
            <div id="signal-widget">
                <div class="hud-label">SIGNAL</div>
                <div class="signal-dot active" id="dot-red"></div>
                <div class="signal-dot" id="dot-yellow"></div>
                <div class="signal-dot" id="dot-green"></div>
                <div id="signal-label">RED</div>
            </div>
            <!-- Speed Limit -->
            <div id="limit-badge">
                <div class="lbl">LIMIT</div>
                <div class="val" id="limit-val">40</div>
                <div class="lbl">km/h</div>
            </div>
        </div>

        <!-- Difficulty -->
        <div id="diff-panel">
            <div class="hud-label" style="color:rgba(255,255,255,0.3);letter-spacing:2px;font-size:9px;">DIFFICULTY
            </div>
            <button class="diff-btn active-easy" id="btn-easy" onclick="setDifficulty('easy')">EASY</button>
            <button class="diff-btn" id="btn-medium" onclick="setDifficulty('medium')">MEDIUM</button>
            <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">HARD</button>
        </div>

        <!-- Back -->
        <button id="back-btn" onclick="window.location.href='index.html'">← BACK</button>

        <!-- Controls -->
        <div id="controls-hint">
            W / ↑ &nbsp; Accelerate<br>
            S / ↓ &nbsp; Brake<br>
            A / ← &nbsp; Steer Left<br>
            D / → &nbsp; Steer Right<br>
            SPACE &nbsp; Handbrake
        </div>

        <!-- Overlays -->
        <div id="warning-flash"></div>
        <div id="red-flash"></div>
        <div id="warning-msg"></div>

        <!-- Minimap -->
        <div id="minimap"><canvas id="minimap-canvas" width="100" height="100"></canvas></div>
    </div>

    <script type="module" src="./src/main3.js"></script>
</body>

</html>
